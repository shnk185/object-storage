version: '3.9'

services:
  cassandra1-object-store:
    image: cassandra:4.1
    container_name: cassandra1-object-store
    hostname: cassandra1-object-store
    ports:
      - "9044:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: object-storage-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1-object-store
      MAX_HEAP_SIZE: 400M
      HEAP_NEWSIZE: 100M
      CASSANDRA_BROADCAST_ADDRESS: cassandra1-object-store
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    ulimits:
      memlock: -1
      nproc: 32768
      nofile: 100000
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra" ,"-e", "describe keyspaces"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - cassandra1-object-store-data:/var/lib/cassandra2

  cassandra2-object-store:
    image: cassandra:4.1
    container_name: cassandra2-object-store
    hostname: cassandra2-object-store
    ports:
      - "9045:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: object-storage-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1-object-store
      MAX_HEAP_SIZE: 400M
      HEAP_NEWSIZE: 100M
      CASSANDRA_BROADCAST_ADDRESS: cassandra2-object-store
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    ulimits:
      memlock: -1
      nproc: 32768
      nofile: 100000
    volumes:
      - cassandra2-object-store-data:/var/lib/cassandra2
    depends_on:
      cassandra1-object-store:
        condition: service_healthy

volumes:
  cassandra1-object-store-data:
  cassandra2-object-store-data: